  Public profile pages (Nov 22, 2026): tryquixote.com/u/<username>. GitHub Pages serves this
  404 page for any unknown path; the script reads the username and loads the public view
  (public_profiles) from Supabase with the publishable key. Private profiles aren't in that
  view, so they show "not found". Page colors match the app (src/lesson/profile-look.ts).

<style>
  :root { --bg:#FFF6E9; --tile:#FBE6CC; --line:#F0D2AE; --ink:#3A140C; --muted:#8A4A2A; --accent:#E4783C; --on-accent:#3A140C; --second:#602418; --on-second:#FFF6E9; --head:Georgia,'Times New Roman',serif; --body:-apple-system,system-ui,'Segoe UI',Helvetica,Arial,sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); }
  a { color: inherit; }
  .stripe { display: flex; height: 6px; }
  .stripe span { flex: 1; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
  .nav { display: flex; justify-content: space-between; align-items: center; padding: 24px 0; gap: 12px; flex-wrap: wrap; }
  .logo { font-family: var(--head); font-weight: 700; font-size: 28px; text-decoration: none; }
  .btn { background: var(--accent); color: var(--on-accent); border-radius: 14px; padding: 12px 20px; font-weight: 700; text-decoration: none; display: inline-block; border: 0; font: inherit; cursor: pointer; }
  .hero { display: flex; align-items: center; gap: 24px; padding: 40px 0 28px; flex-wrap: wrap; }
  .avatar { width: 96px; height: 96px; border-radius: 48px; overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: var(--head); font-weight: 700; font-size: 46px; flex-shrink: 0; }
  .avatar svg { width: 100%; height: 100%; display: block; }
  .who { flex: 1 1 300px; }
  .name { font-family: var(--head); font-weight: 700; font-size: 52px; line-height: 58px; margin: 0; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .flags { font-size: 36px; line-height: 1; }
  .sub { color: var(--muted); font-size: 18px; margin-top: 6px; }
  .side { display: flex; align-items: center; gap: 10px; position: relative; }
  .belt { display: flex; align-items: center; gap: 12px; background: var(--tile); border-radius: 16px; padding: 14px 20px; font-weight: 700; font-size: 18px; }
  .belt i { width: 44px; height: 14px; border-radius: 3px; display: inline-block; box-shadow: 0 0 0 1px rgba(0,0,0,.15); }
  .theme-btn { height: 52px; border-radius: 16px; background: var(--tile); border: 1px solid var(--line); padding: 0 12px; display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--ink); }
  .mini { width: 30px; height: 20px; border-radius: 3px; overflow: hidden; display: flex; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
  .mini span { flex: 1; }
  .menu { position: absolute; right: 0; top: 62px; z-index: 10; width: min(640px, calc(100vw - 48px)); background: var(--tile); border: 1px solid var(--line); border-radius: 20px; padding: 18px; box-shadow: 0 18px 48px rgba(0,0,0,.28); display: none; }
  .menu.open { display: block; }
  .menu h3 { margin: 0 0 12px; font-size: 12px; letter-spacing: 1.5px; color: var(--muted); }
  .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
  .opt { display: flex; align-items: center; gap: 10px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; cursor: pointer; text-align: left; font: inherit; font-size: 14px; font-weight: 600; }
  .opt[aria-pressed="true"] { border: 2px solid var(--accent); }
  .opt .sw { margin-left: auto; display: flex; border-radius: 4px; overflow: hidden; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }
  .opt .sw span { width: 8px; height: 18px; }
  .notice { display: none; border: 1px solid var(--accent); border-radius: 14px; padding: 12px 16px; margin-bottom: 16px; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .notice.on { display: flex; }
  .ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; font: inherit; font-weight: 700; cursor: pointer; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
  .tile { background: var(--tile); border-radius: 20px; padding: 24px; }
  .num { font-family: var(--head); font-weight: 700; font-size: 46px; line-height: 52px; }
  .lbl { color: var(--muted); font-size: 15px; margin-top: 4px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 16px; }
  .row .tile { flex: 1 1 300px; }
  .kicker { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; color: var(--muted); }
  .lang { display: flex; justify-content: space-between; font-size: 17px; margin-top: 16px; }
  .path div { display: flex; justify-content: space-between; margin-top: 10px; font-size: 16px; }
  .band { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; background: var(--second); color: var(--on-second); border-radius: 24px; padding: 32px; margin-top: 32px; }
  .band h2 { font-family: var(--head); font-size: 34px; line-height: 40px; margin: 0; }
  .band p { margin: 6px 0 0; font-size: 17px; }
  .band .btn { box-shadow: 0 0 0 2px var(--on-second); }
  .foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 40px 0; font-size: 14px; color: var(--muted); }
  .center { text-align: center; padding: 120px 24px; }
  .center h1 { font-family: var(--head); font-size: 40px; margin: 0 0 12px; }
  @media (max-width: 600px) { .name { font-size: 40px; line-height: 46px; } .flags { font-size: 28px; } }
</style>

      var n = document.getElementById('notice');
      n.className = 'notice' + (current.id !== owner.id ? ' on' : '');
      document.getElementById('noticeText').textContent = 'You’re trying the ' + current.name + ' colors. ' + name + '’s page color is ' + owner.name + '.';
    }
    grid.addEventListener('click', function (e) {
      var btn = e.target.closest('.opt'); if (!btn) return;
      current = THEMES.filter(function (t) { return t.id === btn.getAttribute('data-id'); })[0] || owner; paint();
      posthog.capture('site_theme_tried', { theme: current.id });
    });
    var menu = document.getElementById('menu'), tb = document.getElementById('themeBtn');
    tb.addEventListener('click', function () { var o = !menu.classList.contains('open'); menu.classList.toggle('open', o); tb.setAttribute('aria-expanded', String(o)); });
    document.getElementById('reset').addEventListener('click', function () { current = owner; paint(); });
    paint();
  }
})();
</script>
</body>
</html>
